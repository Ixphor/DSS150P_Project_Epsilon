# Data contract: Census ACS state estimates (raw layer)
# Documentation contract. The checks below are implemented in code in
# src/validation/validate_census.py (they are not row-condition SQL rules).
# Human-readable version: docs/data_dictionary.md section 1.3.
contract: census_state
version: 1.0.0
table: raw.raw_census_state
grain: One row per state, DC or Puerto Rico
primary_key: [state_fips]
owner: U.S. Census Bureau ACS
source:
  system: U.S. Census Bureau ACS 5-year (2022)
  access: REST API, for=state:*
refresh: each DAG run (values are static for the 2022 vintage)
load_strategy: upsert on state_fips; jam/sentinel codes loaded as NULL
expected_row_count: 52

columns:
  - {name: state_fips,              type: TEXT,      nullable: false, unique: true, pattern: "^[0-9]{2}$"}
  - {name: name,                    type: TEXT,      nullable: true}
  - {name: total_population,        type: NUMERIC,   nullable: true, min_exclusive: 0, census_variable: B01003_001E}
  - {name: median_household_income, type: NUMERIC,   nullable: true, min_exclusive: 0, census_variable: B19013_001E}
  - {name: poverty_population,      type: NUMERIC,   nullable: true, census_variable: B17001_002E}
  - {name: white_alone,             type: NUMERIC,   nullable: true, census_variable: B02001_002E}
  - {name: black_alone,             type: NUMERIC,   nullable: true, census_variable: B02001_003E}
  - {name: ingested_at,             type: TIMESTAMP, nullable: true}

checks:
  - {name: schema_columns_present,      severity: error, on_violation: fail}
  - {name: row_count_is_52,             severity: error, on_violation: fail}
  - {name: unique_state_fips,           severity: error, on_violation: fail}
  - {name: valid_fips_format,           severity: error, on_violation: fail}
  - {name: population_income_positive,  severity: error, on_violation: fail}